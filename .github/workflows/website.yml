# Bouwt bij elke wijziging op main alle animaties en zet de
# "zet-op-paneel"-website op GitHub Pages.
name: Website bouwen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Arduino CLI installeren
        uses: arduino/setup-arduino-cli@v2

      - name: ESP32 en FastLED klaarzetten (met cache)
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ runner.os }}-v1

      # Bewaar het al gecompileerde ESP32-basisdeel tussen keren bouwen,
      # dan hoeft alleen de animatie zelf opnieuw (scheelt minuten).
      - name: Eerder gecompileerde stukken terugzetten
        uses: actions/cache@v4
        with:
          path: ~/.cache/arduino
          key: arduino-bouwcache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: arduino-bouwcache-${{ runner.os }}-

      - name: ESP32-boards en FastLED installeren
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12   # vast: 4.x werkt niet met FastLED 3.7.8 (driver/rmt.h is weg)
          arduino-cli lib install FastLED@3.7.8   # zelfde versie als installeer_hulpmiddelen.sh; nieuwere compileren veel trager
          pip install esptool

      # Firmware van animaties die niet veranderd zijn, hoeft niet opnieuw
      # gecompileerd te worden (zie maak_site.py, "vingerafdruk").
      - name: Al gebouwde animaties terugzetten
        uses: actions/cache@v4
        with:
          path: ~/.cache/ledanimaties-firmware
          key: led-firmware-${{ runner.os }}-${{ github.run_id }}
          restore-keys: led-firmware-${{ runner.os }}-

      - name: Animaties bouwen en website maken
        run: python3 hulpmiddelen/maak_site.py --uit _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
